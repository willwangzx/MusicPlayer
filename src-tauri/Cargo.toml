[package]
name = "music-player"
version = "0.1.0"
description = "A lightweight Windows music player"
authors = ["MusicPlayer contributors"]
edition = "2021"
rust-version = "1.85"
default-run = "music-player"

[lib]
name = "music_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[features]
# The Tauri CLI enables this for standalone builds and leaves it off for dev.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
lofty = "=0.24.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Foundation", "Media", "Win32_Foundation", "Win32_Media_Audio", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Shell"] }
windows-core = "=0.61.2"

[dev-dependencies]
windows = { version = "=0.61.3", features = ["Media_Control", "Win32_UI_WindowsAndMessaging"] }
