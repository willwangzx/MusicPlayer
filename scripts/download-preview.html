<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101217" />
    <title>MusicPlayer download UI fixture</title>
    <style>
      .fixture-header { display: grid; gap: 7px; margin-bottom: 24px; }
      .fixture-header h1, .fixture-header p { margin: 0; }
      .fixture-header h1 { color: #f7f7fb; font-size: 30px; letter-spacing: -.04em; }
      .fixture-header p { color: #aeb1bf; font-size: 13px; }
      #fixture-status { display: grid; gap: 5px; margin: 16px 0 24px; padding: 13px 16px; border: 1px solid rgba(124, 199, 155, .24); border-radius: 10px; color: #b7dfc4; background: rgba(124, 199, 155, .06); font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
      #fixture-status strong { color: #e6f5eb; font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; }
      .fixture-columns { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; align-items: start; }
      .fixture-column { min-width: 0; }
      @media (max-width: 1100px) { .fixture-columns { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main id="fixture-app">
      <div class="fixture-header">
        <h1>Download UI fixture</h1>
        <p>Deterministic IPC data mounts the actual Apple Music and Downloads Svelte views. No network, credentials, or files are used.</p>
      </div>
      <div id="fixture-status" aria-live="polite" aria-atomic="true"></div>
      <div class="fixture-columns">
        <div class="fixture-column" id="apple-root"></div>
        <div class="fixture-column" id="downloads-root"></div>
      </div>
    </main>
    <script type="module" src="./download-preview.js"></script>
  </body>
</html>
